<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Шашки</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%233ddc97'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0a0c10;--panel:rgba(22,27,34,.72);--panel2:rgba(30,37,46,.6);--line:rgba(255,255,255,.07);
  --line2:rgba(255,255,255,.12);--ink:#eef2f6;--ink2:#a9b4c0;--ink3:#6f7b88;--mint:#3ddc97;--amber:#f6b756;
  --rose:#f06a6a;--radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(1100px 700px at 12% -10%,rgba(61,220,151,.10),transparent 60%),
             radial-gradient(900px 600px at 105% 110%,rgba(246,183,86,.08),transparent 55%),var(--bg);
  color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;user-select:none
}
.app{display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;
  border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(18,22,28,.9),rgba(10,12,16,0))}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:12px;position:relative;
  background:linear-gradient(145deg,#2a3440,#151a21);border:1px solid var(--line2);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.logo::before,.logo::after{content:"";position:absolute;width:13px;height:13px;border-radius:50%}
.logo::before{background:radial-gradient(circle at 35% 30%,#fff,#cfc4a9);left:6px;top:6px}
.logo::after{background:radial-gradient(circle at 35% 30%,#3a424c,#10141a);right:6px;bottom:6px}
.brand h1{font-size:17px;font-weight:600}
.brand p{font-size:11px;color:var(--ink3);letter-spacing:.12em;text-transform:uppercase}
.top-actions{display:flex;align-items:center;gap:8px}
.conn{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);padding:7px 12px;
  border-radius:999px;border:1px solid var(--line);background:var(--panel)}
.conn i{width:7px;height:7px;border-radius:50%;background:var(--ink3);transition:.3s}
.conn.on i{background:var(--mint);box-shadow:0 0 10px rgba(61,220,151,.8)}
.conn.off i{background:var(--rose);box-shadow:0 0 10px rgba(240,106,106,.7)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.ghost{padding:8px 14px;border-radius:11px;border:1px solid var(--line);background:var(--panel);
  color:var(--ink2);font-size:13px;transition:.18s}
.ghost:hover{color:var(--ink);border-color:var(--line2);transform:translateY(-1px)}
main{flex:1;min-height:0;overflow:hidden;display:grid;grid-template-columns:262px minmax(0,1fr) 262px;
  gap:20px;padding:20px 24px 24px}
.side{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:hidden}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.player{display:flex;align-items:center;gap:12px;padding:13px 15px;transition:.25s}
.player.active{border-color:rgba(61,220,151,.45);box-shadow:0 0 0 1px rgba(61,220,151,.18),0 12px 30px rgba(0,0,0,.3)}
.player .ava{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:600;
  font-size:15px;color:#10151b;background:linear-gradient(145deg,#f4efe2,#cec2a7);box-shadow:inset 0 -2px 6px rgba(0,0,0,.25)}
.player.black .ava{color:#e8eef4;background:linear-gradient(145deg,#39424d,#161b21);box-shadow:inset 0 -2px 6px rgba(0,0,0,.6)}
.player .who{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.player .nm{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .sub{font-size:11px;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase}
.player .cnt{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.status{text-align:center;padding:14px 10px;border-radius:14px;border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(61,220,151,.07),transparent);font-size:13.5px;min-height:46px;
  display:grid;place-items:center}
.controls{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.primary{padding:13px 16px;border-radius:13px;font-size:14px;font-weight:600;color:#08120d;
  background:linear-gradient(145deg,#57e6a8,#22b87c);box-shadow:0 8px 22px rgba(34,184,124,.28);transition:.18s}
.primary:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(34,184,124,.36)}
.primary:disabled{opacity:.45;transform:none;box-shadow:none;cursor:default}
.danger{padding:11px 16px;border-radius:13px;font-size:13px;color:#ffc9c9;
  border:1px solid rgba(240,106,106,.28);background:rgba(240,106,106,.08);transition:.18s}
.danger:hover{background:rgba(240,106,106,.16)}
.danger:disabled{opacity:.35;cursor:default}
.tips{padding:13px 15px;display:flex;flex-direction:column;gap:10px;flex:none}
.tips .tip{display:flex;flex-direction:column;gap:2px}
.tips .tip b{font-size:12.5px;font-weight:600}
.tips .tip span{font-size:11.5px;color:var(--ink3);line-height:1.35}
.board-area{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  min-height:0;overflow:hidden;position:relative}
.board-shell{position:relative;padding:12px;border-radius:24px;
  background:linear-gradient(160deg,rgba(38,46,56,.9),rgba(16,20,26,.95));border:1px solid var(--line2);
  box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06)}
canvas{display:block;border-radius:14px;cursor:pointer}
.code-badge{position:absolute;top:-13px;left:50%;transform:translateX(-50%);padding:6px 16px;border-radius:999px;
  font-size:12.5px;letter-spacing:.22em;background:#0d1218;border:1px solid rgba(246,183,86,.35);color:var(--amber);
  font-weight:600;display:none;white-space:nowrap}
.code-badge.show{display:block}
.hint{font-size:13px;color:var(--ink3);min-height:20px;text-align:center;padding:0 20px}
.tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:8px;border-radius:9px;font-size:12.5px;color:var(--ink3);transition:.18s}
.tabs button.active{color:var(--ink);background:rgba(255,255,255,.06)}
.moves{padding:8px;overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:2px}
.moves .row{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;font-size:13px;color:var(--ink2)}
.moves .row:nth-child(odd){background:rgba(255,255,255,.025)}
.moves .row .n{color:var(--ink3);font-size:11.5px;width:26px;font-variant-numeric:tabular-nums}
.moves .row .mv{font-family:"Cascadia Mono",Consolas,monospace;font-size:12.5px}
.moves .row.cap .mv{color:var(--amber)}
.moves .empty{color:var(--ink3);font-size:12.5px;text-align:center;padding:24px 10px}
.info{padding:14px 16px;display:flex;flex-direction:column;gap:10px;font-size:13px;overflow-y:auto}
.info .kv{display:flex;justify-content:space-between;gap:10px;color:var(--ink2)}
.info .kv b{color:var(--ink);font-weight:500}
.overlay{position:fixed;inset:0;background:rgba(5,7,10,.72);backdrop-filter:blur(6px);display:none;
  place-items:center;z-index:40;padding:24px}
.overlay.show{display:grid}
.modal{width:min(440px,100%);max-height:82vh;overflow:auto;padding:24px;border-radius:22px;
  background:linear-gradient(180deg,#161b22,#0d1116);border:1px solid var(--line2);
  box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal h2{font-size:19px;font-weight:600;margin-bottom:6px}
.modal p{color:var(--ink2);font-size:13.5px;margin-bottom:16px}
.modal .field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.modal label{font-size:11.5px;color:var(--ink3);letter-spacing:.1em;text-transform:uppercase}
.modal input,.modal select{padding:12px 14px;border-radius:12px;background:#0a0e13;color:var(--ink);
  border:1px solid var(--line2);font:inherit;font-size:14px;outline:none;transition:.18s}
.modal input:focus{border-color:rgba(61,220,151,.5);box-shadow:0 0 0 3px rgba(61,220,151,.1)}
.modal input.big{text-align:center;letter-spacing:.4em;text-transform:uppercase;font-size:20px;font-weight:600}
.modal .acts{display:flex;gap:8px;margin-top:6px}
.modal .acts button{flex:1;padding:12px;border-radius:12px;font-size:13.5px}
.modal .acts.col{flex-direction:column}
.modal .code-big{font-size:30px;letter-spacing:.32em;text-align:center;font-weight:600;color:var(--amber);
  padding:16px;border-radius:14px;background:rgba(246,183,86,.07);border:1px solid rgba(246,183,86,.2);margin-bottom:14px}
.lb{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.lb .r{display:flex;align-items:center;gap:12px;padding:9px 11px;border-radius:10px;font-size:13.5px}
.lb .r:nth-child(odd){background:rgba(255,255,255,.03)}
.lb .r.me{background:rgba(61,220,151,.12)}
.lb .r .i{width:20px;color:var(--ink3);font-variant-numeric:tabular-nums}
.lb .r .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .r .w{color:var(--mint);font-variant-numeric:tabular-nums}
.lb .r .g{color:var(--ink3);font-size:12px;width:56px;text-align:right}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);padding:11px 20px;border-radius:12px;
  font-size:13.5px;background:#10161d;border:1px solid var(--line2);box-shadow:0 18px 50px rgba(0,0,0,.45);
  opacity:0;pointer-events:none;transition:.25s;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1100px){main{grid-template-columns:220px minmax(0,1fr)}.side.right{display:none}}
@media(max-width:820px){main{grid-template-columns:1fr;padding:12px}body{overflow:auto}}
</style>

<body>
<div class="app">

      </div>

  </main>
</div>
<div class="overlay" id="overlay"></div>

<script>
/* ── правила ── */
const DIRS=[[-1,-1],[-1,1],[1,-1],[1,1]],EMPTY=0,W=1,B=2,WK=3,BK=4;
const inB=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
const colorOf=p=>(p===W||p===WK)?1:(p===B||p===BK)?2:0;
const isKing=p=>p===WK||p===BK, isMan=p=>p===W||p===B;
function initialCells(){const a=new Array(64).fill(0);
  for(let r=0;r<8;r++)for(let c=0;c<8;c++)if((r+c)%2===1){if(r<3)a[r*8+c]=B;else if(r>4)a[r*8+c]=W;}
  return a;}
const keyOf=a=>a.join('');
const promotesOn=(p,r)=>p===W?r===0:p===B?r===7:false;
function capFrom(cells,from,piece,captured,path,out,promoted){
  const isK=isKing(piece)||promoted, me=colorOf(piece), r0=from>>3, c0=from&7;
  let any=false;
  for(const [dr,dc] of DIRS){
    if(isK){
      let r=r0+dr,c=c0+dc;
      while(inB(r,c)&&cells[r*8+c]===EMPTY){r+=dr;c+=dc;}
      if(!inB(r,c))continue;
      const v=r*8+c, vp=cells[v];
      if(vp===EMPTY||captured.indexOf(v)>=0||colorOf(vp)===me)continue;
      let lr=r+dr,lc=c+dc;
      while(inB(lr,lc)&&cells[lr*8+lc]===EMPTY){
        const land=lr*8+lc; any=true;
        captured.push(v);path.push(land);
        const nowK=promoted||isKing(piece)||promotesOn(piece,lr);
        if(!capFrom(cells,land,piece,captured,path,out,nowK))
          out.push({from,path:path.slice(),captured:captured.slice(),promote:nowK&&!isKing(piece)});
        path.pop();captured.pop();lr+=dr;lc+=dc;
      }
    } else {
      const mr=r0+dr,mc=c0+dc,lr=r0+2*dr,lc=c0+2*dc;
      if(!inB(lr,lc))continue;
      const v=mr*8+mc, land=lr*8+lc;
      if(cells[v]===EMPTY||cells[land]!==EMPTY||colorOf(cells[v])===me||captured.indexOf(v)>=0)continue;
      any=true;captured.push(v);path.push(land);
      const bk=promotesOn(piece,lr);
      if(!capFrom(cells,land,piece,captured,path,out,bk))
        out.push({from,path:path.slice(),captured:captured.slice(),promote:bk});
      path.pop();captured.pop();
    }
  }
  return any;
}
function captures(cells,turn){const out=[];
  for(let i=0;i<64;i++){const p=cells[i];if(!p||colorOf(p)!==turn)continue;capFrom(cells,i,p,[],[],out,false);}
  return out;}
function quietMoves(cells,turn){const out=[];
  for(let i=0;i<64;i++){const p=cells[i];if(!p||colorOf(p)!==turn)continue;
    const r=i>>3,c=i&7;
    if(isKing(p)){for(const [dr,dc] of DIRS){let rr=r+dr,cc=c+dc;
      while(inB(rr,cc)&&cells[rr*8+cc]===EMPTY){out.push({from:i,path:[rr*8+cc],captured:[],promote:false});rr+=dr;cc+=dc;}}}
    else{const dr=turn===1?-1:1;
      for(const dc of [-1,1]){const rr=r+dr,cc=c+dc;
        if(!inB(rr,cc)||cells[rr*8+cc]!==EMPTY)continue;
        out.push({from:i,path:[rr*8+cc],captured:[],promote:promotesOn(p,rr)});}}}
  return out;}
function legalMoves(cells,turn){const c=captures(cells,turn);return c.length?c:quietMoves(cells,turn);}
function applyMove(cells,move){const n=cells.slice(),p=n[move.from];
  n[move.from]=EMPTY;for(const s of move.captured)n[s]=EMPTY;
  let cur=p;for(const s of move.path){const r=s>>3;if(isMan(cur)&&promotesOn(cur,r))cur=cur===W?WK:BK;}
  n[move.path[move.path.length-1]]=cur;return n;}
function outcomeOf(cells,turn,quiet){
  const mine=cells.filter(p=>colorOf(p)===turn).length;
  const theirs=cells.filter(p=>colorOf(p)===turn%2+1).length;
  if(theirs===0)return turn; if(mine===0)return turn%2+1;
  if(legalMoves(cells,turn).length===0)return turn%2+1;
  if(quiet>=60)return 3; return 0;}
/* ── простой ИИ ── */
function evaluate(cells,turn){let s=0;
  for(let i=0;i<64;i++){const p=cells[i];if(!p)continue;const r=i>>3,c=i&7;
    if(p===W)s+=100+(7-r)*4+((r===7&&(c===0||c===7))?12:0);
    else if(p===WK)s+=340+3;
    else if(p===B)s-=100+r*4+((r===0&&(c===0||c===7))?12:0);
    else if(p===BK)s-=340+3;}
  return turn===1?s:-s;}
const order=ms=>ms.slice().sort((a,b)=>((b.captured.length?100:0)+(b.promote?50:0))-((a.captured.length?100:0)+(a.promote?50:0)));
function negamax(cells,turn,depth,alpha,beta,deadline,ply){
  if(Date.now()>deadline)return evaluate(cells,turn);
  const ms=legalMoves(cells,turn);
  if(!ms.length)return -1e9+ply;
  if(depth===0)return evaluate(cells,turn);
  let best=-1e9;
  for(const m of order(ms)){
    const v=-negamax(applyMove(cells,m),turn%2+1,depth-1,-beta,-alpha,deadline,ply+1);
    if(v>best)best=v; if(best>alpha)alpha=best; if(alpha>=beta)break;}
  return best;}
function aiChoose(cells,turn,level){
  const depth=level==='hard'?6:level==='easy'?2:4, budget=level==='hard'?1400:700;
  const deadline=Date.now()+budget, ms=order(legalMoves(cells,turn));
  if(!ms.length)return null;
  let best=ms[0],bv=-1e9;
  for(const m of ms){
    const v=-negamax(applyMove(cells,m),turn%2+1,depth-1,-1e9,-bv,deadline,1);
    if(v>bv){bv=v;best=m;}}
  return best;}
</script>

<script>
/* ── приложение ── */
(function(){
const API=(location.hostname==='127.0.0.1'||location.hostname==='localhost')
  ? 'https://countrywars.countrywars.deno.net' : '';
const $=s=>document.querySelector(s);
const store={
  get name(){let n=localStorage.getItem('ck.name');
    if(!n){n='Игрок '+Math.floor(1000+Math.random()*9000);localStorage.setItem('ck.name',n);}return n;},
  set name(v){localStorage.setItem('ck.name',v);},
  get cid(){let c=localStorage.getItem('ck.cid');
    if(!c){c='ck_'+Date.now().toString(16)+Math.floor(Math.random()*0x3ffffff).toString(16);localStorage.setItem('ck.cid',c);}return c;},
  get level(){return localStorage.getItem('ck.level')||'normal';},
  set level(v){localStorage.setItem('ck.level',v);}
};
const S={mode:'bot',cells:initialCells(),turn:1,quiet:0,history:[],lastMove:null,mySide:1,
  over:false,winner:0,code:null,names:{white:'Вы',black:'Компьютер'},selected:-1,candidates:[],
  hops:[],targets:[],thinking:false,started:false,anim:null,seq:0};
const rc=i=>[i>>3,i&7], files='abcdefgh';
const sqName=i=>files[i&7]+(8-(i>>3));
const moveText=m=>{const sep=m.captured.length?':':'–';return [m.from].concat(m.path).map(sqName).join(sep);};
const other=t=>t===1?2:1, sideName=t=>t===1?'белые':'чёрные';
const el={status:$('#status'),hint:$('#hint'),moves:$('#movesList'),info:$('#infoPanel'),conn:$('#conn'),
  connText:$('#connText'),code:$('#codeBadge'),toast:$('#toast'),overlay:$('#overlay'),resign:$('#btnResign')};
let toastT=null;
function toast(m){el.toast.textContent=m;el.toast.classList.add('show');clearTimeout(toastT);
  toastT=setTimeout(()=>el.toast.classList.remove('show'),2400);}
function setConn(st,txt){el.conn.className='conn '+st;el.connText.textContent=txt;}
function counts(){let w=0,b=0;S.cells.forEach(p=>{if(colorOf(p)===1)w++;else if(colorOf(p)===2)b++;});return{w,b};}
function updateCards(){
  const topSide=S.mySide===1?2:1, botSide=other(topSide), cnt=counts();
  const fill=(side,n)=>{const nm=side===1?S.names.white:S.names.black;
    n.nm.textContent=nm||(side===1?'Белые':'Чёрные');
    n.ava.textContent=(nm||(side===1?'Б':'Ч'))[0].toUpperCase();
    n.sub.textContent=sideName(side)+(S.mode==='bot'&&side!==S.mySide?' · компьютер':'');
    n.cnt.textContent=side===1?cnt.w:cnt.b;
    n.card.classList.toggle('black',side===2);
    n.card.classList.toggle('active',!S.over&&S.turn===side&&S.started);};
  fill(topSide,{card:$('#pTop'),nm:$('#nmTop'),ava:$('#avaTop'),sub:$('#subTop'),cnt:$('#cntTop')});

/* ── canvas ── */
const cv=$('#board'),ctx=cv.getContext('2d');
let size=620,cell=77.5,dpr=1;
function resize(){
  const area=document.querySelector('.board-area');
  const availH=area.clientHeight-70, availW=area.clientWidth-28;
  size=Math.max(280,Math.min(availW,availH,820)); cell=size/8; dpr=window.devicePixelRatio||1;
  cv.width=Math.round(size*dpr);cv.height=Math.round(size*dpr);

window.addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(()=>resize()).observe(document.querySelector('.board-area'));
function drawPiece(cx,cy,rad,piece,alpha,scale){
  const king=isKing(piece), white=colorOf(piece)===1, r=rad*(scale===undefined?1:scale);
  ctx.save();ctx.globalAlpha=alpha===undefined?1:alpha;
  ctx.beginPath();ctx.arc(cx+r*0.06,cy+r*0.16,r,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,0.34)';ctx.fill();
  const g=ctx.createRadialGradient(cx-r*0.35,cy-r*0.45,r*0.15,cx,cy,r*1.05);
  if(white){g.addColorStop(0,'#fffdf5');g.addColorStop(0.55,'#f0e9d8');g.addColorStop(1,'#c9bda1');}
  else{g.addColorStop(0,'#5a6572');g.addColorStop(0.5,'#2b333c');g.addColorStop(1,'#0f1419');}
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
  ctx.lineWidth=Math.max(1,r*0.05);ctx.strokeStyle=white?'rgba(120,105,75,0.55)':'rgba(255,255,255,0.14)';ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,r*0.78,0,Math.PI*2);
  ctx.strokeStyle=white?'rgba(140,125,95,0.28)':'rgba(255,255,255,0.10)';ctx.lineWidth=Math.max(1,r*0.045);ctx.stroke();
  ctx.beginPath();ctx.ellipse(cx-r*0.28,cy-r*0.42,r*0.38,r*0.2,-0.5,0,Math.PI*2);
  ctx.fillStyle=white?'rgba(255,255,255,0.75)':'rgba(255,255,255,0.10)';ctx.fill();
  if(king){
    const h=r*0.52,w=r*0.86,cx0=cx-w/2,cy0=cy-h*0.12;
    ctx.beginPath();ctx.moveTo(cx0,cy0+h*0.42);ctx.lineTo(cx0+w*0.06,cy0-h*0.05);
    ctx.lineTo(cx0+w*0.28,cy0+h*0.20);ctx.lineTo(cx0+w*0.5,cy0-h*0.28);
    ctx.lineTo(cx0+w*0.72,cy0+h*0.20);ctx.lineTo(cx0+w*0.94,cy0-h*0.05);
    ctx.lineTo(cx0+w,cy0+h*0.42);ctx.closePath();
    const cg=ctx.createLinearGradient(cx0,cy0-h,cx0,cy0+h);
    cg.addColorStop(0,white?'#c99a2e':'#f7c96a');cg.addColorStop(1,white?'#8a6620':'#c08e2c');
    ctx.fillStyle=cg;ctx.fill();ctx.strokeStyle='rgba(0,0,0,0.28)';ctx.lineWidth=Math.max(0.8,r*0.035);ctx.stroke();
  }
  ctx.restore();
}
function draw(now){
  ctx.clearRect(0,0,size,size);
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const x=c*cell,y=r*cell,light=(r+c)%2===0;
    const g=ctx.createLinearGradient(x,y,x+cell,y+cell);
    if(light){g.addColorStop(0,'#f0e5cc');g.addColorStop(1,'#ddceac');}
    else{g.addColorStop(0,'#96754f');g.addColorStop(1,'#7b5c3c');}
    ctx.fillStyle=g;ctx.fillRect(x,y,cell,cell);
  }
  ctx.strokeStyle='rgba(0,0,0,0.28)';ctx.lineWidth=2;ctx.strokeRect(1,1,size-2,size-2);
  ctx.font='600 '+Math.max(9,cell*0.15)+'px "Segoe UI",system-ui,sans-serif';ctx.textBaseline='middle';
  for(let k=0;k<8;k++){
    ctx.textAlign='left';ctx.fillStyle=(k%2===0)?'rgba(60,40,20,0.45)':'rgba(255,248,232,0.42)';
    ctx.fillText(files[k],k*cell+cell*0.07,7*cell+cell*0.86);
    ctx.textAlign='right';ctx.fillStyle=(k%2===0)?'rgba(60,40,20,0.45)':'rgba(255,248,232,0.42)';
    ctx.fillText(String(8-k),cell*0.93,k*cell+cell*0.14);
  }
  const hl=(i,color)=>{const [r,c]=rc(i);ctx.fillStyle=color;ctx.fillRect(c*cell,r*cell,cell,cell);};
  if(S.lastMove){hl(S.lastMove.from,'rgba(246,183,86,0.16)');hl(S.lastMove.path[S.lastMove.path.length-1],'rgba(246,183,86,0.22)');}
  if(S.selected>=0)hl(S.selected,'rgba(61,220,151,0.26)');
  S.hops.forEach(h=>hl(h,'rgba(61,220,151,0.16)'));
  const seen=new Set();
  S.targets.forEach(t=>{if(seen.has(t.sq))return;seen.add(t.sq);
    const [r,c]=rc(t.sq),cx=c*cell+cell/2,cy=r*cell+cell/2;
    if(t.capture){ctx.beginPath();ctx.arc(cx,cy,cell*0.36,0,Math.PI*2);
      ctx.strokeStyle='rgba(246,183,86,0.85)';ctx.lineWidth=Math.max(2,cell*0.045);ctx.stroke();
      ctx.fillStyle='rgba(246,183,86,0.12)';ctx.fill();}
    else{ctx.beginPath();ctx.arc(cx,cy,cell*0.13,0,Math.PI*2);ctx.fillStyle='rgba(61,220,151,0.75)';ctx.fill();}
  });
  const rad=cell*0.37, anim=S.anim;
  for(let i=0;i<64;i++){const p=S.cells[i];if(!p)continue;if(anim&&anim.pieceIdx===i)continue;
    const [r,c]=rc(i);drawPiece(c*cell+cell/2,r*cell+cell/2,rad,p);}
  if(anim){
    const t=Math.min(1,(now-anim.t0)/anim.dur);
    const pts=[anim.from].concat(anim.path), seg=t*(pts.length-1), k=Math.min(pts.length-2,Math.floor(seg)), f=seg-k;
    const [r1,c1]=rc(pts[k]),[r2,c2]=rc(pts[k+1]);
    const e=f<0.5?2*f*f:1-Math.pow(-2*f+2,2)/2;
    const x=(c1+(c2-c1)*e)*cell+cell/2, y=(r1+(r2-r1)*e)*cell+cell/2;
    drawPiece(x,y,rad,anim.piece,1,1+Math.sin(Math.PI*f)*0.06);
    const fade=Math.min(1,t*1.4);
    anim.captured.forEach(ci=>{const [rr,cc]=rc(ci);
      drawPiece(cc*cell+cell/2,rr*cell+cell/2,rad,anim.capturedPieces[ci]||0,1-fade,1-fade*0.4);});
    if(t>=1)S.anim=null;
  }
  if(S.anim)requestAnimationFrame(draw);
}
function render(){requestAnimationFrame(draw);}

/* ── ходы ── */
function myTurn(){
  if(S.over||!S.started||S.mode==='watch')return false;
  if(S.mode==='bot')return S.turn===S.mySide&&!S.thinking;
  return S.turn===S.mySide;
}
function clearSelection(){S.selected=-1;S.candidates=[];S.hops=[];S.targets=[];render();}
function selectSquare(i){
  const moves=legalMoves(S.cells,S.turn).filter(m=>m.from===i);
  S.selected=i;S.hops=[];S.candidates=moves;
  S.targets=moves.map(m=>({sq:m.path[0],capture:m.captured.length>0}));
  if(!moves.length){S.selected=-1;setHint('У этой фигуры нет ходов');}
  else setHint(moves[0].captured.length?'Взятие обязательно — продолжайте серию':'Выберите поле для хода');
  render();
}
function step(i){
  if(S.mode==='watch'||S.over)return;
  if(!myTurn()){if(S.mode==='online'&&S.started&&!S.over)toast('Сейчас ход соперника');return;}
  const piece=S.cells[i];
  if(S.hops.length){
    const n=S.hops.length, fit=S.candidates.filter(m=>m.path[n]===i);
    if(!fit.length){clearSelection();return;}
    S.hops.push(i);S.candidates=fit;
    S.targets=fit.filter(m=>m.path.length>S.hops.length).map(m=>({sq:m.path[S.hops.length],capture:m.captured.length>0}));
    const done=fit.find(m=>m.path.length===S.hops.length);
    if(done)commit(done); else render();
    return;
  }
  if(piece&&colorOf(piece)===S.turn){selectSquare(i);return;}
  if(S.selected>=0){
    const fit=S.candidates.filter(m=>m.path[0]===i);
    if(fit.length){
      S.hops=[i];S.candidates=fit;
      S.targets=fit.filter(m=>m.path.length>1).map(m=>({sq:m.path[1],capture:m.captured.length>0}));
      const done=fit.find(m=>m.path.length===1);
      if(done)commit(done); else render();
      return;
    }
    clearSelection();
  }
}
function commit(move){
  const capturedPieces={};
  move.captured.forEach(ci=>{capturedPieces[ci]=S.cells[ci];});
  S.cells=applyMove(S.cells,move);
  S.quiet=move.captured.length?0:S.quiet+1;
  S.history.push(move);S.lastMove=move;S.turn=other(S.turn);
  S.anim={from:move.from,path:move.path,piece:S.cells[move.path[move.path.length-1]],
    pieceIdx:move.path[move.path.length-1],captured:move.captured,capturedPieces,
    t0:performance.now(),dur:140+110*move.path.length};
  clearSelection();refresh();
  const out=outcomeOf(S.cells,S.turn,S.quiet);
  if(out){endGame(out);return;}
  if(S.mode==='bot'){
    setHint(S.turn===S.mySide?'Ваш ход':'Компьютер думает…');
    if(S.turn!==S.mySide)botMove();
  } else if(S.mode==='online'){
    setHint('Ход отправлен…'); sendMove(move);
  }
}
function botMove(){
  S.thinking=true;
  setTimeout(()=>{
    const m=aiChoose(S.cells,S.turn,store.level);
    S.thinking=false;
    if(!m){const out=outcomeOf(S.cells,S.turn,S.quiet);if(out)endGame(out);return;}
    commit(m);
  },160);
}
function endGame(out){
  S.over=true;S.winner=out;clearSelection();
  if(out===3)el.status.textContent='Ничья';
  else if(S.mode==='watch')el.status.textContent='Победа '+(out===1?'белых':'чёрных');
  else el.status.textContent=out===S.mySide?'Вы победили':'Вы проиграли';
  setHint('');refresh();showResult(out);
}
function showResult(out){
  let title,text;
  if(out===3){title='Ничья';text='60 полуходов без взятий — партия вничью.';}
  else if(S.mode==='watch'){title='Партия окончена';text='Победа '+(out===1?'белых':'чёрных')+'.';}
  else if(out===S.mySide){title='Победа';text='Партия завершена в вашу пользу.';}
  else {title='Поражение';text='Соперник оказался сильнее.';}
  modal('<h2>'+title+'</h2><p>'+text+'</p><div class="acts"><button class="ghost" data-act="close">Закрыть</button>'+
    '<button class="primary" data-act="again">Новая партия</button></div>');
}
cv.addEventListener('click',e=>{

/* ── сеть ── */
async function api(path,method,body,timeout){
  const ctrl=new AbortController(), ms=timeout||12000;
  const timer=setTimeout(()=>ctrl.abort(),ms);
  try{
    const res=await fetch(API+path,{method:method||'GET',
      headers:{'Accept':'application/json','Content-Type':'application/json; charset=utf-8','X-Client-Id':store.cid},
      body:body?JSON.stringify(body):undefined,signal:ctrl.signal,cache:'no-store'});
    const text=await res.text();
    let j;try{j=JSON.parse(text||'{}');}catch(e){j={raw:text};}
    j._status=res.status;return j;
  } finally {clearTimeout(timer);}
}
const parseMove=o=>({from:o.from[0]*8+o.from[1],
  path:(o.path||[]).map(p=>p[0]*8+p[1]),captured:(o.captured||[]).map(p=>p[0]*8+p[1])});
const toArr=i=>[i>>3,i&7];
const moveJSON=m=>({from:toArr(m.from),path:m.path.map(toArr),captured:m.captured.map(toArr)});
async function health(){
  try{const r=await api('/health','GET',null,6000);
    setConn(r.ok?'on':'off',r.ok?'сервер онлайн':'сервер недоступен');return !!r.ok;}
  catch(e){setConn('off','нет связи');return false;}
}

function openGame(code,color){

async function pollGame(code){
  let fails=0;
  while(S.mode==='online'&&S.code===code){
    let st=null;
    try{st=await api('/api/game?code='+code+'&since='+S.seq+'&wait=1','GET',null,34000);
      fails=0;setConn('on','сервер онлайн');}
    catch(e){
      fails++;setConn('off','переподключение');
      if(fails>12){el.status.textContent='Связь потеряна';return;}
      await new Promise(r=>setTimeout(r,2000));continue;
    }
    if(st.error){el.status.textContent='Партия не найдена';return;}
    applyState(st);
    if(S.over)return;
  }
}
function applyState(st){
  if(st.names)S.names={white:st.names.white||'',black:st.names.black||''};
  if(Array.isArray(st.moves)){
    let cells=initialCells(),quiet=0,last=null;const hist=[];
    for(const raw of st.moves){
      const m=parseMove(raw);
      if(!m.path.length)continue;
      cells=applyMove(cells,m);quiet=m.captured.length?0:quiet+1;hist.push(m);last=m;
    }
    const grew=hist.length>S.history.length;
    S.cells=cells;S.history=hist;S.quiet=quiet;S.lastMove=last;S.seq=hist.length;
    if(grew&&last)S.anim={from:last.from,path:last.path,piece:cells[last.path[last.path.length-1]],
      pieceIdx:last.path[last.path.length-1],captured:last.captured,capturedPieces:{},
      t0:performance.now(),dur:140+110*last.path.length};
  }
  S.turn=st.turn==='black'?2:1;
  const status=st.status||'playing';
  if(status==='waiting'){el.status.textContent='Ждём соперника';S.started=false;}
  else if(status==='finished'&&st.winner){
    const out=st.winner==='draw'?3:st.winner==='white'?1:2;
    if(!S.over){
      S.over=true;S.winner=out;
      el.status.textContent=out===3?'Ничья':(out===S.mySide?'Вы победили':'Вы проиграли');
      setHint(st.reason==='abandon'?'Соперник покинул партию':'');
      refresh();showResult(out);return;
    }
  } else {
    S.started=true;
    const oppSeat=st.seats?(S.mySide===1?st.seats.black:st.seats.white):true;
    if(!S.over){
      if(!oppSeat){el.status.textContent='Соперник отключился';setHint('Ждём возвращения соперника');}
      else{el.status.textContent=S.turn===S.mySide?'Ваш ход':'Ход соперника';
        setHint(S.turn===S.mySide?'Выберите фигуру':'Ждём хода соперника');}
    }
  }
  clearSelection();refresh();
}
async function sendMove(move){
  try{
    const body=Object.assign({code:S.code,seq:S.seq},moveJSON(move));
    S.seq=S.history.length;
    const r=await api('/api/game/move','POST',body,14000);
    if(r.error)toast('Сервер отклонил ход: '+r.error);
  }catch(e){toast('Ход не отправлен — нет связи');}
}
async function resign(){if(S.mode!=='online'||!S.code||S.over)return;
  try{await api('/api/game/resign','POST',{code:S.code},9000);}catch(e){}
  S.over=true;el.status.textContent='Вы сдались';refresh();}
el.resign.addEventListener('click',()=>{
  modal('<h2>Сдаться?</h2><p>Партия будет засчитана сопернику.</p>'+
    '<div class="acts"><button class="ghost" data-act="close">Отмена</button>'+
    '<button class="primary" data-act="doResign">Сдаться</button></div>');
});
acts.doResign=()=>{closeModal();resign();};
/* ── списки ── */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function showLeaders(){
  modal('<h2>Лидеры</h2><p>Загрузка…</p>');
  try{
    const r=await api('/api/leaderboard?clientId='+encodeURIComponent(store.cid),'GET',null,12000);
    const ps=r.players||[];
    if(!ps.length){modal('<h2>Лидеры</h2><p>Пока пусто — сыграйте первую партию.</p>'+
      '<div class="acts"><button class="ghost" data-act="close">Закрыть</button></div>');return;}
    const rows=ps.map((p,i)=>'<div class="r '+(p.you?'me':'')+'"><span class="i">'+(i+1)+'</span>'+
      '<span class="nm">'+esc(p.name||'—')+'</span><span class="w">'+(p.wins||0)+'</span>'+
      '<span class="g">'+(p.games||0)+' игр</span></div>').join('');
    modal('<h2>Лидеры</h2><p>Победы и количество партий.</p><div class="lb">'+rows+'</div>'+
      '<div class="acts" style="margin-top:14px"><button class="ghost" data-act="close">Закрыть</button></div>');
  }catch(e){modal('<h2>Лидеры</h2><p>Сервер недоступен.</p><div class="acts"><button class="ghost" data-act="close">Закрыть</button></div>');}
}
async function showGames(){
  modal('<h2>Партии</h2><p>Загрузка…</p>');
  try{
    const r=await api('/api/games','GET',null,12000);
    const gs=r.games||[];
    if(!gs.length){modal('<h2>Партии</h2><p>Сейчас никто не играет.</p>'+
      '<div class="acts"><button class="ghost" data-act="close">Закрыть</button></div>');return;}
    const rows=gs.map((g,i)=>'<div class="r"><span class="i">'+(i+1)+'</span>'+
      '<span class="nm">'+esc((g.white||'?')+' — '+(g.black||'?'))+'</span>'+
      '<span class="g">'+(g.status||'')+'</span>'+
      '<button class="ghost" style="padding:5px 10px;font-size:12px" data-act="watch" data-code="'+esc(g.code||'')+'">смотреть</button></div>').join('');
    modal('<h2>Партии</h2><p>Идущие и недавние партии на сервере.</p><div class="lb">'+rows+'</div>'+
      '<div class="acts" style="margin-top:14px"><button class="ghost" data-act="close">Закрыть</button></div>');
  }catch(e){modal('<h2>Партии</h2><p>Сервер недоступен.</p><div class="acts"><button class="ghost" data-act="close">Закрыть</button></div>');}
}
acts.watch=b=>{
  const code=b.dataset.code;if(!code)return;
  closeModal();S.mode='watch';S.started=true;S.over=false;S.code=code;S.seq=0;S.history=[];
  el.status.textContent='Наблюдение';pollWatch(code);
};
async function pollWatch(code){
  while(S.mode==='watch'&&S.code===code){
    try{
      const st=await api('/api/game?code='+code+'&since='+S.seq+'&wait=1','GET',null,34000);
      if(st.error){el.status.textContent='Партия не найдена';return;}
      applyState(st);
    }catch(e){await new Promise(r=>setTimeout(r,2000));}
  }
}
function showSettings(){
  modal('<h2>Настройки</h2>'+
    '<div class="field"><label>Имя игрока</label><input id="inName" maxlength="14" value="'+store.name.replace(/"/g,'&quot;')+'"></div>'+
    '<div class="field"><label>Сложность компьютера</label><select id="inLevel">'+
    ['easy','normal','hard'].map(v=>'<option value="'+v+'"'+(store.level===v?' selected':'')+'>'+
      ({easy:'Лёгкая',normal:'Обычная',hard:'Сложная'})[v]+'</option>').join('')+
    '</select></div><div class="acts"><button class="ghost" data-act="close">Отмена</button>'+
    '<button class="primary" data-act="saveSettings">Сохранить</button></div>');
}
acts.saveSettings=()=>{saveName();const l=$('#inLevel');if(l)store.level=l.value;closeModal();toast('Настройки сохранены');};
acts.close=()=>closeModal();
acts.again=()=>{closeModal();newGameModal();};
/* ── кнопки ── */
$('#btnNew').addEventListener('click',newGameModal);
$('#btnLeaders').addEventListener('click',showLeaders);
$('#btnGames').addEventListener('click',showGames);
$('#btnSettings').addEventListener('click',showSettings);
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));
  const t=b.dataset.tab;
  el.moves.style.display=t==='moves'?'':'none';
  el.info.style.display=t==='info'?'':'none';
}));
window.addEventListener('pagehide',()=>{
  if(S.mode==='online'&&S.code&&!S.over){
    try{fetch(API+'/api/game/resign',{method:'POST',keepalive:true,
      headers:{'Content-Type':'application/json','X-Client-Id':store.cid},
      body:JSON.stringify({code:S.code})});}catch(e){}
  }
  try{navigator.sendBeacon('/quit','1');}catch(e){}
});
setInterval(()=>{fetch('/hb',{cache:'no-store'}).catch(()=>{});},4000);
function boot(){
  resize();startBot();
  el.status.textContent='Выберите режим игры';
  setHint('«Новая партия» — игра с компьютером или онлайн.');
  refresh();health();
  setInterval(()=>{if(S.mode!=='online')health();},45000);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
